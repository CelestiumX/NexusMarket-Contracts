[package]
name = "marketplace-escrow"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]
doctest = false

[dependencies]
soroban-sdk = { version = "21", features = ["alloc"] }
stellar-asset-contract = { version = "21" }

[dev-dependencies]
soroban-sdk = { version = "21", features = ["test-utils", "alloc"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = false
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[workspace]
members = [".", "tests"]
